# Builds the game server images (docker/server.Dockerfile) from native-multiplayer and pushes
# them to this repository owner's GHCR, for amd64 and arm64 (a VPS or a Raspberry Pi):
#   ghcr.io/<owner>/gta2-server:relay   the relay only (enough for consoles)
#   ghcr.io/<owner>/gta2-server:web     the relay plus the browser game of the same commit
# and the same two with -<short commit> for a fixed version. deploy/consoles.md says how to run them.
# A first push makes the package private: make it public in the package's settings on GitHub.
# server-image.yml is upstream's (main, ghcr.io/m1stermo); this one leaves it alone.
name: server-images-native

on:
  push:
    branches: [native-multiplayer]
    paths:
      - server/**
      - port/**
      - '!port/native/**'
      - web/**
      - scripts/build_port.py
      - scripts/build_unshield_wasm.sh
      - docker/server.Dockerfile
      - docker/server.Dockerfile.dockerignore
      - .github/workflows/server-images-native.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-images-native
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gta2-server" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          target: relay
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.name.outputs.image }}:relay
            ${{ steps.name.outputs.image }}:relay-${{ steps.name.outputs.short }}
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.name.outputs.image }}:web
            ${{ steps.name.outputs.image }}:web-${{ steps.name.outputs.short }}
